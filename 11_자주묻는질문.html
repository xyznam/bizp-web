<script>
/* ---- 화면 고유 로직: FAQ 데이터 + 카테고리/검색 필터 + 문의 모달 (계약 §1: 화면 고유 표현 한정) ---- */
(function () {
  "use strict";

  var CATS = {
    start:   "🔰 처음 시작하기",
    content: "📋 콘텐츠 검토와 발행",
    bizchat: "💬 비즈챗 문자",
    billing: "💳 요금과 결제"
  };

  // 전부 이 세션에서 확정된 실제 정책 근거(콘텐츠검토_정책.md·매장구조_회원정책.md 등)를 그대로 옮긴 것 — 지어낸 답 없음
  var FAQS = [
    { cat: "start", q: "매장 등록 후에는 뭘 해야 하나요?", a: "매장 상세정보를 채우고 나면 AI 학습이 시작돼요. 학습이 최소 한 번 끝나야 콘텐츠를 만들 수 있어요." },
    { cat: "start", q: "AI가 우리 가게를 어떻게 아나요?", a: "사장님이 연결해 두신 채널의 글과 사진을 보고 배워요. 배운 내용은 언제든 다시 확인할 수 있어요." },
    { cat: "start", q: "위탁(L1)과 셀프(L2)는 뭐가 다른가요?", a: "위탁은 대행사와 계약해서 운영·결제를 맡긴 상태라 조회 위주로 이용해요. 셀프는 대행사 없이 직접 운영·결제까지 하는 방식이에요." },
    { cat: "content", q: "승인하면 언제 올라가나요?", a: "오늘 자정에 자동으로 올라가요. 발행이 끝나면 알림으로 알려드려요." },
    { cat: "content", q: "글을 고치고 싶으면 어떻게 하나요?", a: "콘텐츠 검토 화면에서 반려를 누르고 원하시는 점을 알려주시면 돼요. 다시 만들어서 곧 보여드려요." },
    { cat: "content", q: "검수는 누가 하나요?", a: "매장마다 사장님이 직접 검수하는 방식과 대행사가 검수하는 방식 중 하나를 골라 쓸 수 있어요. 우리 매장 정보 화면에서 설정할 수 있어요." },
    { cat: "content", q: "반려랑 다시 쓰기는 뭐가 달라요?", a: "반려는 승인을 거절하고 이유만 남기는 거예요. 다시 쓰기는 AI에게 무엇을 바꿀지 직접 알려주고 새로 만들게 하는 기능이에요." },
    { cat: "bizchat", q: "문자 발송 한도가 다 되면 어떻게 되나요?", a: "한도를 채우면 그달에는 더 이상 발송되지 않아요. 다음 달이 되면 자동으로 다시 채워져요." },
    { cat: "bizchat", q: "비즈챗 문자는 단골에게만 보내는 건가요?", a: "아니요, 지역·연령 같은 조건으로 대상을 골라서 보내는 문자 서비스예요." },
    { cat: "billing", q: "구독을 취소하면 바로 멈추나요?", a: "아니요, 남은 결제 기간까지는 그대로 이용할 수 있어요. 결제 주기가 끝나는 날부터 멈춰요. 그 전엔 언제든 구독을 유지하는 쪽으로 되돌릴 수 있어요." },
    { cat: "billing", q: "요금제는 어떻게 바꾸나요?", a: "요금제·비용 화면에서 요금제 변경을 눌러 언제든 바꿀 수 있어요. 다음 결제일부터 적용돼요." },
    { cat: "billing", q: "위탁 매장도 직접 결제하나요?", a: "아니요, 위탁 매장은 대행사가 결제를 대신하거나 여러 매장을 묶어서 한 번에 처리하는 경우가 많아요." },
    { cat: "billing", q: "회원 탈퇴랑 매장 구독 취소는 같은 건가요?", a: "아니요, 서로 달라요. 구독 취소는 이 매장의 유료 서비스를 멈추는 거고, 회원 탈퇴는 내 로그인 계정 자체를 없애는 거예요. 내 계정 화면에서 따로 처리해요." }
  ];

  var state = { cat: "all", q: "" };

  /* ---- 내 문의 내역 (2026-08-28 신설, 11_도움말과 동일 로직) ----
     예시 히스토리 + 이 세션에서 새로 보낸 문의(localStorage, 두 화면이 같은 키를 씀)를 합쳐서 보여줌. */
  var HIST_KEY = "uw_my_inquiries";
  var SEED_INQUIRIES = [
    { type: "요금·결제", q: "다음 달부터 Pro 요금제로 자동 바뀌나요?", a: "아니요, 직접 바꾸기 전까지는 지금 요금제 그대로예요. 요금제·비용 화면에서 언제든 바꾸실 수 있어요.", date: "2026-07-02", status: "answered" },
    { type: "오류 신고", q: "블로그 자동 발행이 이틀째 안 됐어요", a: "확인해 보니 연결하신 블로그 주소가 바뀌어 있었어요. 채널 연결을 다시 확인해 주시면 정상적으로 발행될 거예요.", date: "2026-06-20", status: "answered" },
    { type: "사용 방법", q: "매장을 2개 운영하는데 하나로 관리할 수 있나요?", date: "2026-08-26", status: "pending" }
  ];
  function loadMyInquiries() {
    var extra = [];
    try { extra = JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); } catch (e) {}
    return extra.concat(SEED_INQUIRIES);
  }
  function addMyInquiry(item) {
    var extra = [];
    try { extra = JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); } catch (e) {}
    extra.unshift(item);
    try { localStorage.setItem(HIST_KEY, JSON.stringify(extra)); } catch (e) {}
  }
  function renderInquiryHistory() {
    var el = document.getElementById("inquiry-history-list");
    if (!el) return;
    var list = loadMyInquiries();
    if (!list.length) {
      el.innerHTML = '<div style="padding:24px 0;text-align:center;color:var(--ink-400);font-size:13px">아직 남긴 문의가 없어요</div>';
      return;
    }
    el.innerHTML = list.map(function (it, i) {
      var last = i === list.length - 1;
      var badge = it.status === "answered" ? '<span class="uw-badge b-gray">답변 완료</span>' : '<span class="uw-badge b-orange">답변 대기</span>';
      var answerHtml = it.a
        ? '<div style="margin-top:8px;padding:10px 12px;background:var(--inset);border-radius:var(--radius-tile);font-size:13px;color:var(--ink-700);line-height:1.7"><b style="color:var(--ink-900)">답변</b><br>' + it.a + '</div>'
        : '<div style="margin-top:8px;font-size:12px;color:var(--ink-500)">아직 답변 전이에요. 보통 하루 안에 답이 와요.</div>';
      return '<details class="help-faq-item">' +
          '<summary style="cursor:pointer;padding:13px 0;' + (last ? "" : "border-bottom:1px solid var(--divider);") + 'display:flex;align-items:center;gap:8px">' +
            '<span class="uw-kw-chip" style="font-size:11px;flex-shrink:0">' + it.type + '</span>' +
            '<span style="flex:1;font-size:14px;font-weight:700">' + it.q + '</span>' +
            badge +
          '</summary>' +
          '<div style="padding:0 0 13px;' + (last ? "" : "border-bottom:1px solid var(--divider);") + '">' +
            '<div style="font-size:12px;color:var(--ink-400)">' + it.date + '</div>' +
            answerHtml +
          '</div>' +
        '</details>';
    }).join("");
  }
  function syncInquiryBadge() {
    var badge = document.getElementById("inquiry-history-badge");
    if (!badge) return;
    var pending = loadMyInquiries().filter(function (it) { return it.status !== "answered"; }).length;
    if (pending > 0) { badge.textContent = pending; badge.style.display = ""; }
    else { badge.style.display = "none"; }
  }
  document.addEventListener("DOMContentLoaded", syncInquiryBadge);

  function render() {
    var list = document.getElementById("faq-list");
    var empty = document.getElementById("faq-empty");
    var q = state.q.trim().toLowerCase();
    var filtered = FAQS.filter(function (f) {
      if (state.cat !== "all" && f.cat !== state.cat) return false;
      if (q && f.q.toLowerCase().indexOf(q) === -1 && f.a.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });

    if (!filtered.length) {
      list.innerHTML = "";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    var groups = {};
    var order = [];
    filtered.forEach(function (f) {
      if (!groups[f.cat]) { groups[f.cat] = []; order.push(f.cat); }
      groups[f.cat].push(f);
    });

    var html = "";
    order.forEach(function (catId) {
      if (state.cat === "all") html += '<div class="faq-group-title">' + CATS[catId] + '</div>';
      html += '<div class="uw-rows">';
      groups[catId].forEach(function (f, i) {
        var last = i === groups[catId].length - 1;
        html +=
          '<details class="help-faq-item">' +
            '<summary style="cursor:pointer;padding:13px 0;font-size:14px;font-weight:700;' + (last ? "" : "border-bottom:1px solid var(--divider);") + '">' + f.q + '</summary>' +
            '<div style="padding:12px 0 13px;font-size:13px;line-height:1.8;color:var(--ink-600);' + (last ? "" : "border-bottom:1px solid var(--divider);") + '">' + f.a + '</div>' +
          '</details>';
      });
      html += '</div>';
    });
    list.innerHTML = html;
  }

  function applyFromURL() {
    var params = new URLSearchParams(location.search);
    var cat = params.get("cat");
    var q = params.get("q");
    if (cat && CATS[cat]) state.cat = cat;
    if (q) state.q = q;
    document.querySelectorAll(".faq-cat-chip").forEach(function (c) {
      c.classList.toggle("is-on", c.getAttribute("data-cat") === state.cat);
    });
    if (q) document.getElementById("faq-search-input").value = q;
  }

  document.addEventListener("DOMContentLoaded", function () {
    applyFromURL();
    render();
  });

  document.addEventListener("click", function (e) {
    var chip = e.target.closest(".faq-cat-chip");
    if (chip) {
      state.cat = chip.getAttribute("data-cat");
      document.querySelectorAll(".faq-cat-chip").forEach(function (c) { c.classList.toggle("is-on", c === chip); });
      render();
      return;
    }
    if (e.target.closest("#btn-faq-search")) {
      state.q = document.getElementById("faq-search-input").value;
      render();
      return;
    }
    var helpTypeChip = e.target.closest(".help-type-chip");
    if (helpTypeChip) {
      document.querySelectorAll(".help-type-chip").forEach(function (c) {
        c.classList.remove("is-selected"); c.style.background = ""; c.style.color = "";
      });
      helpTypeChip.classList.add("is-selected");
      helpTypeChip.style.background = "var(--blue)";
      helpTypeChip.style.color = "#fff";
      return;
    }
    var a = e.target.closest("[data-action]");
    if (!a) return;
    if (a.getAttribute("data-action") === "open-modal" && a.getAttribute("data-modal") === "modal-inquiry-history") {
      renderInquiryHistory();
    }
    if (a.getAttribute("data-action") === "send-inquiry") {
      a.closest(".uw-modal-backdrop").classList.remove("is-open");
      var typeChip = document.querySelector(".help-type-chip.is-selected");
      var ta = document.getElementById("help-inquiry-text");
      var text = ta ? ta.value.trim() : "";
      if (text) {
        var today = new Date().toISOString().slice(0, 10);
        addMyInquiry({ type: typeChip ? typeChip.getAttribute("data-help-type") : "기타", q: text, date: today, status: "pending" });
        syncInquiryBadge();
      }
      if (ta) ta.value = "";
      window.UW.toast("문의를 받았어요. 답이 오면 알림으로 알려드릴게요");
    }
  });

  document.getElementById("faq-search-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { state.q = e.target.value; render(); }
  });
})();
</script>
</body>
</html>
